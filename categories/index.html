<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse paranormal phenomena by category - cryptids, ghosts, mythological creatures, UFOs, and more in the Wyrdness database.">
  <title>Categories - Wyrdness</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <a href="#main-content" class="sr-only sr-only--focusable">Skip to main content</a>
  
  <header class="site-header">
    <div class="container">
      <div class="site-header__content">
        <a href="/" class="site-header__logo">
          <img src="https://avatars.githubusercontent.com/u/235253252" alt="Wyrdness" width="40" height="40">
        </a>
        
        <input type="checkbox" id="menu-toggle" class="menu-toggle sr-only">
        <label for="menu-toggle" class="menu-toggle__label">
          <span class="sr-only">Toggle menu</span>
          <span class="menu-toggle__icon"></span>
        </label>
        
        <nav class="site-nav" aria-label="Main navigation">
          <ul class="site-nav__list">
            <li><a href="/browse/" class="site-nav__link">Browse</a></li>
            <li><a href="/categories/" class="site-nav__link site-nav__link--active">Categories</a></li>
            <li><a href="/map/" class="site-nav__link">Map</a></li>
            <li><a href="/timeline/" class="site-nav__link">Timeline</a></li>
            <li><a href="/favorites/" class="site-nav__link">Favorites</a></li>
            <li><a href="/about/" class="site-nav__link">About</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  
  <main id="main-content">
    <div class="container" style="padding: var(--space-2xl) var(--space-md);">
      <h1 class="mb-lg">All Categories</h1>
      
      <div id="loading" class="text-center" style="padding: var(--space-2xl);">
        <p class="text-muted">Loading categories...</p>
      </div>
      
      <div id="categories-grid" class="grid grid--4 gap--lg" style="display: none;"></div>
    </div>
  </main>
  
  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__bottom">
        <p class="text-muted text-center">
          Comprehensive documentation of paranormal phenomena from cultures worldwide.
        </p>
        <p class="text-muted text-center">
          &copy; 2026 Wyrdness Project. All phenomenon data is freely available.
        </p>
      </div>
    </div>
  </footer>
  
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async function() {
      const loading = document.getElementById('loading');
      const grid = document.getElementById('categories-grid');
      
      try {
        const data = await window.API.getAllPhenomena();
        const phenomena = data.phenomena || data;
        
        const categories = {};
        phenomena.forEach(p => {
          const cat = p.category || 'uncategorized';
          if (!categories[cat]) {
            categories[cat] = { count: 0, items: [] };
          }
          categories[cat].count++;
          categories[cat].items.push(p);
        });
        
        const sortedCategories = Object.entries(categories).sort((a, b) => b[1].count - a[1].count);
        
        loading.style.display = 'none';
        grid.style.display = 'grid';
        
        const emojiMap = {
          cryptid: '🦍', ghost: '👻', ghost_haunting: '👻',
          mythological_creature: '🐲', mythological: '🐲',
          demon_angel: '😈', demon: '😈',
          alien: '👽', ufo_uap: '🛸',
          urban_legend: '🏙️', modern_internet_folklore: '💻', internet_folklore: '💻',
          paranormal: '✨', psychic_phenomena: '🔮',
          yokai: '👹', fae_folklore: '🧚',
          folklore: '📖', monster: '👾',
          spirit: '🌟', entity_spirit: '🌟',
          supernatural: '🔮', undead: '🧟',
          conspiracy_theory: '🕵️', anomaly: '❔',
          atmospheric_phenomenon: '🌩️', atmospheric_phenomena: '🌩️',
          location: '📍', haunted_location: '🏚️', location_phenomenon: '📍',
          shapeshifter: '🐺', shapeshifter_undead: '🐺',
          cultural_artifact: '🏺', uncategorized: '❓'
        };

        function prettyName(key) {
          if (!key || key === 'uncategorized') return 'Uncategorized';
          return key.replace(/[_|]/g, ' ').replace(/\s+/g, ' ').trim()
            .toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
        }

        grid.innerHTML = sortedCategories.map(([name, data]) => {
          const emoji = emojiMap[name] || '❓';
          const label = prettyName(name);

          return `
            <div style="background: var(--bg-secondary); padding: var(--space-lg); border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
              <a href="/categories/${name}/" style="text-decoration: none; color: inherit;">
                <div style="font-size: var(--font-3xl); text-align: center; margin-bottom: var(--space-sm);">${emoji}</div>
                <h3 style="text-align: center; margin-bottom: var(--space-xs);">${label}</h3>
              </a>
              <p class="text-muted text-center mb-md">${data.count} phenomena</p>
              <details>
                <summary style="cursor: pointer; color: var(--accent-purple);">Quick preview</summary>
                <ul style="margin-top: var(--space-sm); padding-left: var(--space-md);">
                  ${data.items.slice(0, 10).map(p => `<li><a href="/phenomena/${p.id}/">${p.name}</a></li>`).join('')}
                  ${data.count > 10 ? `<li class="text-muted"><a href="/categories/${name}/">...and ${data.count - 10} more</a></li>` : ''}
                </ul>
              </details>
            </div>
          `;
        }).join('');
        
      } catch (error) {
        loading.innerHTML = '<p class="error">Failed to load categories.</p>';
      }
    })();
  </script>
</body>
</html>
