name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@832a22d201efcdbc21b35041628382f266976c24  # v8.0.0
        with:
          root: .
          # Don't waste minutes on the per-phenomenon pages — they're all generated from
          # templates/phenomenon.html which is itself validated.
          extra: --ignore-re ".*phenomena/.*/index.html$"

  links:
    runs-on: ubuntu-latest
    # Lychee is informational; flaky external links shouldn't block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >
            --no-progress
            --cache
            --max-cache-age 1d
            --max-retries 2
            --retry-wait-time 10
            --timeout 20
            --accept 200,204,206,301,302,308,403,429,999
            --exclude-mail
            --exclude '^https?://(www\.)?github\.com/wyrdness'
            --exclude '^https?://creativecommons\.org'
            './*.html'
            './about/**/*.html'
            './browse/**/*.html'
            './categories/**/*.html'
            './help/**/*.html'
            './favorites/**/*.html'
            './map/**/*.html'
            './timeline/**/*.html'
            './templates/**/*.html'
            './*.md'
          fail: false
